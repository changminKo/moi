name: Publish images

# Builds the two runtime images once, for amd64 and arm64, and publishes them
# to GHCR on every push to main. Hosts never build: the Oracle reference host
# (1 GB Micro or A1) pulls `ghcr.io/changminko/moi-{paper-api,web}:main`.
# No secrets or provider settings are baked in — everything arrives through
# the compose environment at run time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: paper-api
            dockerfile: apps/paper-api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/changminko/moi-${{ matrix.name }}:main
            ghcr.io/changminko/moi-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
