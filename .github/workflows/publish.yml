name: Publish images

# Builds the two runtime images once, for amd64 and arm64, and publishes them
# to GHCR on every push to main. Hosts never build: the Oracle reference host
# (1 GB Micro or A1) pulls `ghcr.io/changminko/moi-{paper-api,web}:main`.
# No secrets or provider settings are baked in — everything arrives through
# the compose environment at run time.
#
# The images are pushed under the commit sha first, scanned with Trivy, and
# only a clean scan (no HIGH/CRITICAL with a fix available) moves the `main`
# tag. The packages stay private: hosts authenticate with a read-only token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: paper-api
            dockerfile: apps/paper-api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/changminko/moi-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/changminko/moi-${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote to main
        run: docker buildx imagetools create -t ghcr.io/changminko/moi-${{ matrix.name }}:main ghcr.io/changminko/moi-${{ matrix.name }}:${{ github.sha }}
