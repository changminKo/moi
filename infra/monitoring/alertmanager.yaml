# Alertmanager routing for Moi.
#
# Notifications are deduplicated and cooled down on alert name, market,
# incident id, and recovery epoch. `incident` and `recovery_epoch` arrive as
# series labels from the safety and recovery subsystems; alerts that lack them
# group on alertname + market only.
route:
  receiver: moi-ops
  group_by: [alertname, market, incident, recovery_epoch]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: moi-ops
      group_wait: 0s
      repeat_interval: 1h

receivers:
  - name: moi-ops
    webhook_configs:
      # Replace with the on-call webhook of the hosting provider at deploy time.
      - url: http://alert-webhook.internal/moi
        send_resolved: true

inhibit_rules:
  # Once the emergency latch is engaged, downstream market alerts are noise.
  - source_matchers:
      - alertname = EmergencyLatchActive
    target_matchers:
      - alertname =~ "MarketData.*|FeedReconnectFlapping|RecoveryDurationExceeded"
    equal: [market]
